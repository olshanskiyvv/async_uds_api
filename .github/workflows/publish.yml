name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get local version
        id: local
        run: |
          VERSION=$(grep '^version =' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get PyPI version
        id: pypi
        run: |
          VERSION=$(curl -s https://pypi.org/pypi/async-uds-api/json | jq -r '.info.version // "0.0.0"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Compare versions
        run: |
          if [ "${{ steps.local.outputs.version }}" = "${{ steps.pypi.outputs.version }}" ]; then
            echo "::error::Version ${{ steps.local.outputs.version }} already exists on PyPI"
            echo "Please update version in pyproject.toml"
            exit 1
          fi
          echo "✅ Version ${{ steps.local.outputs.version }} is new"

  build:
    needs: check-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run linter
        run: uv run ruff check

      - name: Run type checker
        run: uv run mypy

      - name: Run tests
        run: uv run pytest -v

      - name: Build package
        run: uv build

      - name: Check package with twine
        run: uv run twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
