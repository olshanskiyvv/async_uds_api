    post:
      tags:
        - Goods
      summary: Create goods or category
      description: >
        Creating an item/category in UDS. The ID of a successfully created item
        can be used as a `nodeId`

        to create an item/category in this category and get a list of internal
        items.


        ### Key points

        * The type of the object being created is specified in the `data.type`
        field. Three values are supported:
          - `CATEGORY` — to create a product category
          - `ITEM` — to create a product item
          - `VARYING_ITEM` — to create a product with variants
        * You can create subcategories within categories (up to three levels of
        nesting).

        * You can create up to 20 categories in the main list, 20 subcategories
        per category, and 20 subcategories per subcategory.

        * To create an item without a category, set `nodeId` to `null`.

        * To create an item with unlimited stock, set `inStock` to `null`.


        ### Errors

        | Status | Error Code | Description |

        |--------|------------|-------------|

        | `400` | `badRequest` | Validation errors occurred. See the `errors`
        field for details. |

        | `400` | `goods.nodeIndex.invalid` | Specifying a `nodeId` is not
        allowed when creating a category. |

        | `400` | `goods.limitIsReached` | The product limit has been exceeded.
        |

        | `401` | `unauthorized` | Invalid company ID or API Key. |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoodsDetailed'
      responses:
        '200':
          description: Created goods item or category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsDetailed'
              example:
                id: 201
                name: T-shirt
                nodeId: 100
                externalId: tshirt
                dateCreated: '2024-11-25T12:00:00.000Z'
                data:
                  type: ITEM
                  price: 25
                  description: Cotton T-shirt
                  sku: CLT-001
                  offer: null
                  inventory:
                    inStock: 50
                hidden: false
                blocked: false
                imageUrls: []
