    put:
      tags:
        - Goods
      summary: Update goods/category by id
      description: >
        Update goods/category by its internal UDS ID.


        ### Key points

        * The type of the object being edited is specified in the `data.type`
        field. Three values are supported:
          - `CATEGORY` — for a category
          - `ITEM` — for a product item
          - `VARYING_ITEM` — for a product with variants
        * To move an item to a different category, specify the target category
        ID in `nodeId`.

        * Moving a category inside another category is not allowed.

        * To remove an item from its category (make it top-level), set `nodeId`
        to `null`.


        ### Errors

        | Status | Error Code | Description |

        |--------|------------|-------------|

        | `400` | `goods.nodeIndex.invalid` | Specifying a `nodeId` is not
        allowed when updating a category. |

        | `400` | `goods.limitIsReached` | The product limit has been exceeded.
        |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoodsDetailed'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsDetailed'
              example:
                id: 345
                name: Espresso Double
                nodeId: 100
                externalId: espresso
                dateCreated: '2024-06-15T09:30:00.000Z'
                data:
                  type: ITEM
                  price: 4.5
