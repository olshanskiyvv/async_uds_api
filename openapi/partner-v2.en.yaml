components:
  securitySchemes:
    Basic:
      type: http
      scheme: basic
      description: >
        In order to call API methods partner applications require to
        authenticate requests with a [Basic
        Auth](https://en.wikipedia.org/wiki/Basic_access_authentication).


        To authorize requests clients MUST set base auth token value in
        `Authorization` http header.

        The auth token value is a string of `Basic <base64-encoded-string>`,
        where <base64-encoded-string> is a base64 encode of
        "<companyId>:<apiKey>"

        Create or get existed apiKey from [API Settings
        page](https://admin.uds.app/admin/integration).


        **Example:**


        ```bash

        curl -X GET -s https://api.uds.app/partner/v2/settings -H Authorization:
        Basic MTIzNDp0b2tlbg==

        ```


        where "MTIzNDp0b2tlbg==" is a base64 encode of "1234:token"


        **Attention:** *In order to protect your token against hacker attacks
        all requests use only HTTPS protocol.*
    Webhook:
      type: apiKey
      in: header
      name: X-Signature
      description: >
        In order to secure the request all webhook calls are signed by a
        signature.


        Signature calculation pseudo code:


        ```

        md5 ( concat ( X-RequestId, X-Timestamp, Client-Id, Api-Key ) )

        ```


        Where:

        * `md5` - is md5 hash function

        * `concat` - string concatenation

        * `X-RequestId` - value of `X-RequestId` http header

        * `X-Timestamp` - value of `X-Timestamp` http header

        * `Client-Id` - client id (or a company id)

        * `Api-Key` - same api key required to authenticate Partner API requests


        ### Example


        For example, partner has a client id equal to `123456` and api key equal
        to `ZWY5ZmI4ZjQtNTgxMC00M2M3LWE2YTYtZGVhMDRmZTAwNzQxCg==`.

        Then a typical webhook request would look like:


        ```

        curl -X POST https://webhook-server.com/api/evetns/operation \
          -H 'X-RequestId: bf7d19b0-8e3c-4d55-98ba-2783915957b3 \
          -H 'X-Timestamp: 2018-10-22T13:52:46,769Z' \
          -H 'X-Signature: 'dc8d4416d3e01a40fd10f1c7bf3f4754' \
          -d '{ ... }'  # body skipped for the sake of example simplicity
        ```


        Where `dc8d4416d3e01a40fd10f1c7bf3f4754` is a result of:


        ```

        $ echo -n
        'bf7d19b0-8e3c-4d55-98ba-2783915957b32018-10-22T13:52:46,769Z123456ZWY5ZmI4ZjQtNTgxMC00M2M3LWE2YTYtZGVhMDRmZTAwNzQxCg=='
        | md5sum

        dc8d4416d3e01a40fd10f1c7bf3f4754  -

        ```
  responses:
    NotFound:
      description: Entity not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GeneralError'
  parameters:
    id:
      name: id
      in: path
      description: Object ID.
      schema:
        type: integer
        format: int64
      required: true
    max:
      name: max
      in: query
      description: Limit results size.
      schema:
        type: integer
        default: 10
        maximum: 50
    offset:
      name: offset
      in: query
      description: Paginate results by given offset.
      schema:
        type: integer
        default: 0
        maximum: 10000
    cursor:
      name: cursor
      in: query
      description: Paginate results by cursor.
      schema:
        type: string
    externalId:
      name: externalId
      in: path
      description: Object external identifier.
      schema:
        type: string
      required: true
    x-request-id:
      name: X-Origin-Request-Id
      in: header
      description: Request identifier (UUID).
      required: true
      schema:
        type: string
    x-timestamp:
      name: X-Timestamp
      in: header
      description: Timestamp in ISO8601 date format.
      required: true
      schema:
        type: string
        format: date-time
    x-signature:
      name: X-Signature
      in: header
      description: Webhook request signature.
      required: true
      schema:
        type: string
  headers:
    X-Request-Id:
      description: Unique request identifier.
      schema:
        type: string
        format: uuid
    X-Timestamp:
      description: Request timestamp.
      schema:
        type: string
        format: date-time
  schemas:
    GeneralError:
      type: object
      description: General error.
      properties:
        errorCode:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Error description.
      required:
        - errorCode
        - message
    ErrorCode:
      type: string
      description: Short code.
      enum:
        - notFound
        - badRequest
        - forbidden
    CompanySettings:
      type: object
      description: >
        Company loyalty program configuration. Contains discount policies,
        membership tiers,

        reward rates, and operational settings. Retrieved via GET /settings.
      required:
        - id
        - name
        - promoCode
        - marketingSettings
        - currency
        - baseDiscountPolicy
        - purchaseByPhone
        - usePointsByPhone
        - writeInvoice
        - slug
      properties:
        id:
          type: integer
          description: Company ID.
        name:
          type: string
          description: Company name.
        promoCode:
          type: string
          description: >-
            Company invitation promo code. Customers can use this code to join
            your loyalty program.
        currency:
          description: ISO-4217
          nullable: true
          type: string
        baseDiscountPolicy:
          type: string
          description: |
            Defines loyalty program type:

            * `APPLY_DISCOUNT` — apply a discount to an order;

            * `CHARGE_SCORES` base discount won't apply but customer will
            receive points award
              with the same base discount rate applied to `cash` part of purchase operation.
          enum:
            - APPLY_DISCOUNT
            - CHARGE_SCORES
        loyaltyProgramSettings:
          $ref: '#/components/schemas/LoyaltyProgramSettings'
        purchaseByPhone:
          type: boolean
          description: Permission to make purchases by phone number.
        usePointsByPhone:
          type: boolean
          description: Permission to spend points purchases by phone number.
        writeInvoice:
          type: boolean
          description: >-
            Necessity to indicate a bill number when performing transactions
            through UDS Cashier.
        slug:
          type: string
          description: Company slug for web page.
    LoyaltyProgramSettings:
      type: object
      description: >
        Loyalty program settings defining membership tiers, reward rates, and
        referral bonuses.

        Configured in [UDS
        Admin](https://admin.uds.app/admin/marketing/discount).
      required:
        - baseMembershipTier
        - membershipTiers
        - referralCashbackRates
        - cashierAward
        - referralReward
        - discountVip
        - receiptLimit
        - deferPointsForDays
      properties:
        baseMembershipTier:
          $ref: '#/components/schemas/MembershipTier'
        membershipTiers:
          type: array
          description: Status settings.
          items:
            $ref: '#/components/schemas/MembershipTier'
        referralCashbackRates:
          type: array
          description: Rewards for referrals (3 levels)
          items:
            type: number
        cashierAward:
          type: number
          nullable: true
          description: Cashier’s reward rate for the performed transaction.
        referralReward:
          type: number
          nullable: true
          description: Customer’s reward for an effective recommendation.
        receiptLimit:
          type: number
          nullable: true
          description: Maximum transaction amount that can be made through UDS Cashier.
        deferPointsForDays:
          type: number
          nullable: true
          description: >-
            Number of days before earned cashback points become available in the
            customer's balance. A value of 0 means points are available
            immediately.
        firstPurchasePoints:
          type: number
          nullable: true
          minimum: 0.01
          description: Number of points for the first purchase
    Customer:
      type: object
      description: >
        A customer enrolled in your company's loyalty program. Contains UDS
        profile information,

        current point balance, membership tier, and transaction statistics.
        Returned by list and search endpoints.
      properties:
        uid:
          type: string
          description: Customer ID in the UDS.
          nullable: true
        avatar:
          type: string
          description: Avatar URL.
          nullable: true
        displayName:
          type: string
          description: Customer name.
        gender:
          type: string
          nullable: true
          description: Gender.
          allOf:
            - $ref: '#/components/schemas/Gender'
        phone:
          type: string
          description: Participant phone number.
          nullable: true
        birthDate:
          type: string
          nullable: true
          format: date
          readOnly: true
          description: Customer birth date
        participant:
          $ref: '#/components/schemas/Participant'
        channelName:
          type: string
          description: Acquisition channel name
          nullable: true
        email:
          type: string
          description: Customer email
          nullable: true
    CustomerDetail:
      description: >-
        Detailed customer profile including loyalty program data and assigned
        tags. Extends the base Customer schema with tag information for customer
        segmentation.
      allOf:
        - $ref: '#/components/schemas/Customer'
        - type: object
          properties:
            tags:
              description: List of tags
              type: array
              nullable: false
              default: []
              items:
                $ref: '#/components/schemas/TagModel'
    PurchaseTokenAction:
      description: |
        Type of action associated with a customer's purchase token:
        * `PURCHASE` — standard purchase operation
        * `BONUS_ITEMS_PURCHASE` — purchase using bonus items
        * `GOODS_ORDER_COMPLETE` — completing a goods order
        * `CERTIFICATE` — certificate redemption
      type: string
      nullable: false
      enum:
        - PURCHASE
        - BONUS_ITEMS_PURCHASE
        - GOODS_ORDER_COMPLETE
        - CERTIFICATE
    MembershipTier:
      type: object
      description: >
        Membership tier (loyalty level) configuration. Defines the
        discount/cashback rate and

        automatic upgrade conditions based on spending or referral count.
      required:
        - name
        - rate
      properties:
        uid:
          type: string
          description: Tier ID.
          readOnly: true
        name:
          type: string
          description: Tier name.
        rate:
          type: number
          description: Tier rate.
          maximum: 100
          minimum: 0
        maxScoresDiscount:
          type: number
          nullable: true
          description: The maximum discount (in percentage) allowed when redeeming points.
        conditions:
          type: object
          description: Conditions to upgrade customer tiers automatically.
          properties:
            totalCashSpent:
              type: object
              description: Upgrade to tier when customer reaches target `cashSpent`.
              nullable: true
              properties:
                target:
                  type: number
                  description: Amount of cash spent.
            effectiveInvitedCount:
              type: object
              description: >-
                Upgrade to tier when customer reaches target
                `effectiveInvitedCount`.
              nullable: true
              properties:
                target:
                  type: integer
                  description: Amount of invited count.
    Gender:
      type: string
      nullable: true
      description: Customer's gender for personalization and marketing segmentation.
      enum:
        - MALE
        - FEMALE
        - NOT_SPECIFIED
    Participant:
      type: object
      description: >
        Customer's loyalty program details within your company — point balance,
        discount rates,

        transaction statistics, and membership tier. This is the core loyalty
        data for a customer.
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Participant ID.
        inviterId:
          type: integer
          format: int64
          nullable: true
          description: ID of the inviting participant.
        points:
          type: number
          description: >-
            Available loyalty points that the customer can redeem for discounts
            on future purchases.
        discountRate:
          type: number
          description: >-
            Current discount rate (percentage) based on the customer's
            membership tier. Applied to purchases when baseDiscountPolicy is
            APPLY_DISCOUNT.
        cashbackRate:
          type: number
          description: >-
            Current cashback rate (percentage) based on the customer's
            membership tier. Determines points earned per purchase when
            baseDiscountPolicy is CHARGE_SCORES.
        cashSpent:
          type: number
          description: >-
            Total amount the customer has paid in currency across all completed
            purchases (excluding point payments). Used for automatic membership
            tier upgrades based on spending thresholds.
        savedFunds:
          type: number
          description: >-
            Total amount the customer has saved through discounts, point
            redemptions, and certificates across all transactions.
        invitedCount:
          type: integer
          description: >-
            Total number of people this customer has invited to join the loyalty
            program via referral link.
        effectiveInvitedCount:
          type: integer
          description: >-
            Number of invited people who made at least one purchase (effective
            referrals). Used for membership tier upgrade conditions.
        operationsCount:
          type: integer
          description: Total number of completed purchase transactions by this customer.
        fullRefundsCount:
          type: integer
          description: Number of fully refunded transactions for this customer.
        note:
          type: string
          nullable: true
          description: Note.
        membershipTier:
          $ref: '#/components/schemas/MembershipTier'
        dateCreated:
          type: string
          nullable: true
          format: date-time
          readOnly: true
          description: Date and time when customer was registered in company.
        lastTransactionTime:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Date and time when the customer made the last transaction.
        pointsExpireIn:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Date and time when the customer's points will be expired.
    Operation:
      type: object
      description: >
        A completed loyalty transaction (purchase, refund, or reward). Contains
        transaction details,

        customer info, cashier info, and point movements. Uses discriminator on
        `action` field.
      required:
        - action
      discriminator:
        propertyName: action
        mapping:
          PURCHASE: '#/components/schemas/PurchaseOperation'
      properties:
        id:
          type: integer
          description: Transaction ID in the UDS database.
          format: int64
          readOnly: true
        dateCreated:
          type: string
          description: Transaction date.
          format: date-time
          readOnly: true
        action:
          $ref: '#/components/schemas/Action'
          description: Operation type.
        state:
          $ref: '#/components/schemas/ActionState'
        customer:
          allOf:
            - $ref: '#/components/schemas/CustomerShortInfo'
            - type: object
              properties:
                uid:
                  nullable: true
                  description: Customer ID in UDS (UID).
        cashier:
          allOf:
            - $ref: '#/components/schemas/CashierInfo'
            - nullable: true
        branch:
          allOf:
            - $ref: '#/components/schemas/BranchInfo'
            - nullable: true
        points:
          type: number
          description: |
            The amount of points which changed customer balance as a result of
            the operation.

            A negative value means write-off of bonus points and a positive
            value means point accrual.
        certificatePoints:
          type: number
          nullable: true
          description: Number of deducted certificate points.
        receiptNumber:
          type: string
          nullable: true
          description: Receipt number.
        origin:
          type: object
          description: Reference to origin operation (for operations in state REVERSAL).
          nullable: true
          properties:
            id:
              type: integer
              format: int64
              description: Origin transaction ID.
    VoucherInfo:
      description: >
        Voucher details returned after creating a voucher via POST
        /operations/voucher.

        Contains the code for printing on the receipt and QR code URLs for
        display.
      properties:
        code:
          type: string
          description: UDS voucher code
        qrCodeText:
          type: string
          description: UDS voucher info for qrcode
        qrCode128:
          type: string
          description: Link for generate qrcode image (size 128)
        qrCode256:
          type: string
          description: Link for generate qrcode image (size 256)
        expiresIn:
          type: string
          format: date-time
          description: Voucher code expires in
        points:
          type: number
          description: Minimum points for withdrawal
    CreateVoucher:
      type: object
      required:
        - receipt
      properties:
        nonce:
          type: string
          nullable: true
          description: Nonce for voucher (UUID)
        cashier:
          type: object
          nullable: true
          description: Cashier information.
          properties:
            externalId:
              type: string
              description: Cashier identifier.
            name:
              type: string
              nullable: true
              description: Cashier name.
        receipt:
          type: object
          description: Receipt information.
          required:
            - total
            - cash
            - points
          properties:
            total:
              type: number
              description: Total receipt amount (in currency units).
            number:
              type: string
              nullable: true
              description: Receipt number.
            skipLoyaltyTotal:
              type: number
              nullable: true
              description: >-
                A part of the bill amount for which cashback is not credited and
                to which the discount does not apply (in currency units).
    CreateOperation:
      type: object
      description: >
        Request body for creating a purchase operation. Identify the customer
        via promo code, UID,

        or phone number. The `receipt.cash` value must come from POST
        /operations/calc — do not

        calculate it manually.
      required:
        - receipt
      properties:
        code:
          type: string
          nullable: true
          description: UDS promo-code.
        participant:
          type: object
          nullable: true
          description: Customer information.
          properties:
            uid:
              type: string
              nullable: true
              description: Customer ID in the UDS.
            phone:
              type: string
              nullable: true
              description: Customer phone number.
        nonce:
          type: string
          nullable: true
          description: Nonce for operation (UUID)
        cashier:
          type: object
          nullable: true
          description: Cashier information.
          properties:
            externalId:
              type: string
              description: Cashier identifier.
            name:
              type: string
              nullable: true
              description: Cashier name.
        receipt:
          type: object
          description: Receipt information.
          required:
            - total
            - cash
            - points
          properties:
            total:
              type: number
              description: Total receipt amount (in currency units).
            cash:
              type: number
              description: Payment amount (in currency units).
            points:
              type: number
              description: Points amount.
            number:
              type: string
              nullable: true
              description: Receipt number.
            skipLoyaltyTotal:
              type: number
              nullable: true
              description: >-
                A part of the bill amount for which cashback is not credited and
                to which the discount does not apply (in currency units).
            unredeemableTotal:
              type: number
              nullable: true
              description: A part of total that cannot be redeemed with points
        tags:
          type: array
          nullable: true
          description: 'List of tag ids to be set to customer, null means no changes'
          items:
            $ref: '#/components/schemas/TagId'
        items:
          type: array
          nullable: true
          description: List of receipt line items (products/services).
          items:
            $ref: '#/components/schemas/OperationItem'
    OperationItem:
      type: object
      description: A single line item in the receipt.
      required:
        - price
        - qty
      properties:
        itemId:
          type: string
          nullable: true
          maxLength: 256
          description: Item identifier.
        itemCode:
          type: string
          nullable: true
          minLength: 2
          maxLength: 256
          description: Item code.
        type:
          type: string
          nullable: true
          maxLength: 256
          description: 'Item type (e.g. "product", "service").'
        name:
          type: string
          nullable: true
          maxLength: 256
          description: Item name.
        measure:
          type: string
          nullable: true
          minLength: 2
          maxLength: 256
          description: 'Unit of measure (e.g. "pcs", "kg", "litre").'
        vatCode:
          type: string
          nullable: true
          minLength: 2
          maxLength: 256
          description: 'VAT code (e.g. "vat20", "vat10", "vat0").'
        price:
          type: number
          minimum: 0.01
          description: Unit price (in currency units).
        discountPrice:
          type: number
          nullable: true
          minimum: 0.01
          description: >-
            Discounted unit price (in currency units). If set, this price is
            used instead of `price`.
        qty:
          type: number
          minimum: 0.01
          description: Quantity.
        sku:
          type: string
          nullable: true
          minLength: 2
          maxLength: 256
          description: Stock keeping unit.
        isAlcohol:
          type: boolean
          nullable: true
          description: Whether the item is an alcohol product.
        isTobacco:
          type: boolean
          nullable: true
          description: Whether the item is a tobacco product.
        excise:
          type: number
          nullable: true
          description: Excise tax amount.
        classificationCode:
          type: string
          nullable: true
          minLength: 2
          maxLength: 256
          description: Item classification code.
        modifiers:
          type: array
          nullable: true
          description: Item modifiers as a list of key-value pairs.
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
        attributes:
          type: object
          nullable: true
          description: Arbitrary key-value attributes for the item.
          additionalProperties:
            type: string
    PurchaseCalcRequest:
      description: >
        Request body for calculating purchase discounts and cashback. Provide
        the customer identifier

        (code, uid, or phone) and receipt total to receive the loyalty
        calculation.
      type: object
      required:
        - receipt
      properties:
        code:
          type: string
          nullable: true
          description: UDS promo-code.
        participant:
          type: object
          nullable: true
          description: Customer information.
          properties:
            uid:
              type: string
              nullable: true
              description: Customer ID in the UDS.
            phone:
              type: string
              nullable: true
              description: Customer phone number.
        receipt:
          type: object
          description: Receipt information.
          required:
            - total
          properties:
            total:
              type: number
              description: Total receipt amount (in currency units).
            skipLoyaltyTotal:
              type: number
              description: >-
                A part of the bill amount for which cashback is not credited and
                to which the discount does not apply (in currency units).
            unredeemableTotal:
              type: number
              description: A part of total that cannot be redeemed with points
            points:
              type: number
              description: |
                Desired points to withdraw. Not required, would be max possible
                if not specified.
    PurchaseCalcResponse:
      type: object
      required:
        - user
        - purchase
      properties:
        user:
          $ref: '#/components/schemas/CustomerDetail'
        purchase:
          $ref: '#/components/schemas/PurchaseCalc'
    PurchaseCalc:
      type: object
      description: >
        Loyalty program calculation result for a purchase. Shows discount
        amounts, point values,

        final cash payment, and projected cashback. All monetary values are in
        company currency units.
      properties:
        maxPoints:
          type: number
          description: >-
            Maximum number of loyalty points the customer can redeem for this
            purchase, considering their balance and tier limits.
        total:
          type: number
          description: >-
            Original purchase total before any loyalty benefits are applied (in
            currency units).
        skipLoyaltyTotal:
          type: number
          description: >-
            Portion of the purchase total excluded from loyalty program benefits
            — no discount applied, no cashback earned (e.g., alcohol, tobacco,
            gift cards). In currency units.
        unredeemableTotal:
          type: number
          description: >-
            Portion of the purchase total that cannot be paid with loyalty
            points (in currency units).
        discountAmount:
          description: >-
            Discount amount in currency units. Only applicable when
            baseDiscountPolicy is APPLY_DISCOUNT.
          type: number
        discountPercent:
          description: >-
            Discount as a percentage of the total. Only applicable when
            baseDiscountPolicy is APPLY_DISCOUNT.
          type: number
        points:
          type: number
          description: >-
            Number of loyalty points being redeemed (deducted from customer
            balance) for this purchase.
        pointsPercent:
          description: Points redemption as a percentage of the total purchase amount.
          type: number
        netDiscount:
          description: >-
            Total combined discount from both loyalty discount and point
            redemption (in currency units).
          type: number
        netDiscountPercent:
          description: >-
            Total combined discount as a percentage (loyalty discount + point
            redemption).
          type: number
        certificatePoints:
          description: >-
            Number of certificate points deducted (separate from regular loyalty
            points).
          type: number
        cash:
          type: number
          description: >-
            Final amount the customer pays in currency after all discounts and
            point redemptions. Use this value in POST /operations.
        cashTotal:
          type: number
          description: >-
            Total amount to be paid including extra charges like delivery fees
            (in currency units).
        cashBack:
          type: number
          description: >-
            Loyalty points the customer will earn from this purchase. Applied
            after operation is completed (may be deferred by deferPointsForDays
            setting).
        extras:
          type: object
          description: >-
            Additional payments will not be taken into account by the loyalty
            program.
          properties:
            delivery:
              type: number
              description: Delivery cost (in currency units).
        maxScoresDiscount:
          type: number
          description: The maximum discount (in percentage) allowed when redeeming points.
    Action:
      type: string
      description: Transaction type.
      enum:
        - PURCHASE
    ActionState:
      type: string
      description: >
        Transaction lifecycle status:

        * `NORMAL` — active transaction, loyalty benefits applied

        * `CANCELED` — transaction was canceled, no loyalty impact

        * `REVERSAL` — transaction was refunded, loyalty benefits reversed
        (points returned, cashback deducted)
      enum:
        - NORMAL
        - CANCELED
        - REVERSAL
    PurchaseOperation:
      allOf:
        - $ref: '#/components/schemas/Operation'
        - type: object
          properties:
            total:
              type: number
              description: Receipt total amount (in currency units).
            cash:
              type: number
              description: Payment amount (in currency units).
      description: Customer ID in UDS (UID).
    Reference:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Identifier.
        displayName:
          type: string
          description: Name.
    CashierInfo:
      type: object
      description: Cashier information.
      properties:
        id:
          type: integer
          format: int64
          description: Cashier ID.
        displayName:
          type: string
          description: Cashier name.
    ParticipantShortInfo:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Customer ID in the company.
        displayName:
          type: string
          description: Customer name.
    BranchInfo:
      type: object
      description: Branch information.
      properties:
        id:
          type: integer
          format: int64
          description: Branch ID.
        displayName:
          type: string
          description: Branch name.
    GoodsInfoType:
      type: object
      description: >-
        Product catalog item — can be a category, a simple item, or an item with
        variants (VARYING_ITEM).
      required:
        - name
        - data
      properties:
        id:
          type: integer
          readOnly: true
          description: Goods ID.
        name:
          type: string
          description: Goods name.
        data:
          $ref: '#/components/schemas/GoodsData'
        hidden:
          type: boolean
          description: Is the goods hidden.
        blocked:
          type: boolean
          description: Is the goods blocked.
          readOnly: true
        nodeId:
          type: integer
          nullable: true
          description: ID of the category in which the product is included
        imageUrls:
          description: Array of imageId from presigned url response
          type: array
          nullable: false
          readOnly: true
          items:
            type: string
            nullable: false
        externalId:
          type: string
          nullable: true
          description: External goods identifier.
        dateCreated:
          type: string
          format: date-time
          readOnly: true
          description: Date item created.
    GoodsDetailed:
      description: Goods properties.
      required:
        - name
        - data
      properties:
        id:
          type: integer
          readOnly: true
          description: Goods ID.
        name:
          type: string
          description: Goods name.
        nodeId:
          type: integer
          nullable: true
          description: ID of the category in which the item is included.
        externalId:
          type: string
          nullable: true
          description: External goods identifier.
        dateCreated:
          type: string
          format: date-time
          readOnly: true
          description: Date item created.
        data:
          $ref: '#/components/schemas/GoodsData'
        hidden:
          type: boolean
          nullable: true
          description: Is the goods hidden.
        blocked:
          type: boolean
          nullable: true
          readOnly: true
          description: Is the goods blocked.
        imageUrls:
          description: Array of imageId from presigned url response
          type: array
          nullable: false
          readOnly: true
          items:
            type: string
            nullable: false
    GoodsData:
      type: object
      description: |
        Product type-specific properties. Uses discriminator on `type` field:
        CATEGORY — a folder for organizing items,
        ITEM — a simple product with price and inventory,
        VARYING_ITEM — a product with multiple variants (e.g., sizes, colors).
      oneOf:
        - $ref: '#/components/schemas/GoodsCategoryType'
        - $ref: '#/components/schemas/GoodsItemType'
        - $ref: '#/components/schemas/GoodsVaryingItemType'
      discriminator:
        propertyName: type
        mapping:
          CATEGORY: '#/components/schemas/GoodsCategoryType'
          ITEM: '#/components/schemas/GoodsItemType'
          VARYING_ITEM: '#/components/schemas/GoodsVaryingItemType'
    GoodsCategoryType:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/GoodsType'
    GoodsItemType:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/GoodsType'
        sku:
          type: string
          nullable: true
          description: Item stock number.
        price:
          type: number
          description: Item price.
        description:
          type: string
          nullable: true
          description: Item description.
        offer:
          allOf:
            - $ref: '#/components/schemas/GoodsOffer'
            - nullable: true
        inventory:
          $ref: '#/components/schemas/GoodsInventory'
        photos:
          $ref: '#/components/schemas/GoodsPhotos'
        measurement:
          $ref: '#/components/schemas/GoodsMeasurement'
        increment:
          type: number
          nullable: true
          description: >-
            Amount of the item that the buyer can increase or decrease by 1
            interval
        minQuantity:
          type: number
          nullable: true
          description: Minimal quantity of item for order
        vatCode:
          allOf:
            - $ref: '#/components/schemas/VatCode'
            - nullable: true
        paymentSubject:
          allOf:
            - $ref: '#/components/schemas/PaymentSubject'
            - nullable: true
    GoodsVaryingItemType:
      type: object
      description: >-
        A product with multiple variants (e.g., sizes, colors, flavors). Each
        variant has its own name, price, and inventory.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/GoodsType'
        variants:
          type: array
          description: Variants of item.
          items:
            allOf:
              - $ref: '#/components/schemas/GoodsVariantType'
        description:
          type: string
          nullable: true
          description: Variant description.
        photos:
          $ref: '#/components/schemas/GoodsPhotos'
        vatCode:
          allOf:
            - $ref: '#/components/schemas/VatCode'
            - nullable: true
        paymentSubject:
          allOf:
            - $ref: '#/components/schemas/PaymentSubject'
            - nullable: true
    GoodsVariantType:
      properties:
        name:
          type: string
          description: Variant name.
        sku:
          type: string
          nullable: true
          description: Variant stock number.
        price:
          type: number
          description: Variant price.
        offer:
          allOf:
            - $ref: '#/components/schemas/GoodsOffer'
            - nullable: true
        inventory:
          $ref: '#/components/schemas/GoodsInventory'
    GoodsOffer:
      type: object
      description: Promotional information.
      properties:
        offerPrice:
          type: number
          nullable: true
          description: Discount price.
        skipLoyalty:
          type: boolean
          description: >-
            Flag of goods item price which cashback is not credited and to which
            the discount does not apply (in currency units).
    GoodsInventory:
      type: object
      nullable: true
      description: Item quantity in stock.
      properties:
        inStock:
          type: integer
          description: Item quantity in stock. The "null" value means unlimited quantity.
          nullable: true
    GoodsType:
      type: string
      enum:
        - CATEGORY
        - ITEM
        - VARYING_ITEM
    GoodsPhotos:
      type: array
      nullable: false
      description: Array of image identifiers
      items:
        type: string
        description: Base64 encoded photo path
    GoodsOrderDetailed:
      type: object
      description: >
        Detailed goods order from the UDS marketplace. Contains order items,
        delivery info,

        payment method, loyalty calculation, and processing status.
      properties:
        id:
          type: integer
          description: Order ID.
        dateCreated:
          type: string
          format: date-time
          description: Order date.
        comment:
          type: string
          nullable: true
          description: Comment on the order.
        state:
          $ref: '#/components/schemas/GoodsOrderState'
          description: Order status.
        orderStatus:
          nullable: true
          description: Order processing status
          allOf:
            - $ref: '#/components/schemas/GoodsOrderUpdateStatus'
        cash:
          type: number
          description: Amount payable in currency units.
        points:
          type: number
          description: Number of deducted points.
        total:
          type: number
          description: Total order amount.
        certificatePoints:
          type: number
          description: Number of deducted certificate points.
        customer:
          $ref: '#/components/schemas/CustomerShortInfo'
        delivery:
          $ref: '#/components/schemas/DeliveryType'
        onlinePayment:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/OnlinePayment'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        items:
          type: array
          description: Items information.
          items:
            allOf:
              - $ref: '#/components/schemas/GoodsOrderItem'
        purchase:
          type: object
          nullable: false
          allOf:
            - $ref: '#/components/schemas/PurchaseCalc'
        externalOrder:
          type: object
          nullable: true
          properties:
            id:
              type: string
              nullable: true
              description: external order id
            link:
              type: string
              nullable: false
              description: external order link
    GoodsOrderUpdate:
      type: object
      properties:
        deliveryCase:
          $ref: '#/components/schemas/DeliveryCase'
        items:
          type: array
          description: Items information.
          items:
            oneOf:
              - $ref: '#/components/schemas/GoodsOrderItemUpdate'
              - $ref: '#/components/schemas/GoodsOrderItemNew'
    GoodsOrderItemUpdate:
      type: object
      properties:
        id:
          type: integer
          description: Item ID in the UDS.
        variantName:
          type: string
          description: Name of goods variant if this goods type is VARYING_ITEM.
        qty:
          type: integer
          description: Quantity.
    GoodsOrderItemNew:
      type: object
      properties:
        externalId:
          type: string
          description: External item identifier.
        name:
          type: string
          description: Goods name.
        variantName:
          type: string
          description: Name of goods variant if this goods type is VARYING_ITEM
        qty:
          type: integer
          description: Quantity.
        price:
          type: number
          description: Item price.
        skipLoyalty:
          type: boolean
          default: false
          description: Don’t apply loyalty program terms.
    OnlinePayment:
      type: object
      nullable: true
      description: Online payment information.
      properties:
        paymentProvider:
          type: string
          description: Payment provider type.
          enum:
            - B2P
            - CLOUD_PAYMENTS
            - YOOKASSA
            - PAYTURE
            - CUSTOM
        id:
          type: string
          description: Payment identifier in external payment system.
        completed:
          type: boolean
          description: Payment status.
    PaymentMethod:
      type: object
      description: Payment information.
      properties:
        type:
          type: string
          description: Payment type.
          enum:
            - BEST_TO_PAY
            - CLOUD_PAYMENTS
            - CASH
            - MANUAL
            - CUSTOM
        name:
          type: string
          description: Manual type name.
          nullable: true
        online:
          type: boolean
          description: Is payment online.
        providerType:
          type: string
          description: Payment provider type.
          nullable: true
    GoodsOrderItem:
      type: object
      description: Item information.
      properties:
        id:
          type: integer
          description: Item ID.
        externalId:
          type: string
          nullable: true
          description: External item identifier.
        name:
          type: string
          description: Goods name.
        variantName:
          type: string
          nullable: true
          description: Name of goods variant if this goods type is VARYING_ITEM.
        sku:
          type: string
          nullable: true
          description: Item stock number.
        type:
          type: string
          description: Item type.
          enum:
            - ITEM
            - VARYING_ITEM
        qty:
          type: integer
          description: Quantity.
        price:
          type: number
          description: Item price.
        offerPrice:
          type: number
          nullable: true
          description: Discount price.
        skipLoyalty:
          type: boolean
          default: false
          description: Don’t apply loyalty program terms.
        measurement:
          $ref: '#/components/schemas/GoodsMeasurement'
        dataMatrixCodes:
          type: array
          nullable: true
          description: Data matrix codes (Честный знак) for the item.
          items:
            type: string
        deliveryState:
          $ref: '#/components/schemas/DeliveryState'
    DeliveryState:
      type: object
      nullable: true
      readOnly: true
      description: Delivery state of the order item.
      properties:
        deliveredQty:
          type: number
          description: Quantity of delivered items.
        canceledQty:
          type: number
          description: Quantity of canceled items.
    DeliveryType:
      type: object
      description: Method of receiving the order.
      oneOf:
        - $ref: '#/components/schemas/Pickup'
        - $ref: '#/components/schemas/Delivery'
      discriminator:
        propertyName: type
        mapping:
          PICKUP: '#/components/schemas/Pickup'
          DELIVERY: '#/components/schemas/Delivery'
    ReceiverInfo:
      type: object
      description: Receiver information.
      properties:
        receiverName:
          type: string
          description: Name of the customer who will pick up the order.
        receiverPhone:
          type: string
          description: Phone number of the customer who will pick up the order.
        userComment:
          type: string
          nullable: true
          description: Customer comment on the order.
    DeliveryTypes:
      type: string
      description: Type of receiving the order.
      enum:
        - PICKUP
        - DELIVERY
    Pickup:
      type: object
      description: Pickup of the order.
      required:
        - type
      allOf:
        - $ref: '#/components/schemas/ReceiverInfo'
        - type: object
          properties:
            branch:
              $ref: '#/components/schemas/BranchInfo'
            type:
              $ref: '#/components/schemas/DeliveryTypes'
    Delivery:
      type: object
      description: Order delivery.
      required:
        - type
      allOf:
        - $ref: '#/components/schemas/ReceiverInfo'
        - type: object
          properties:
            deliveryCase:
              $ref: '#/components/schemas/DeliveryCase'
            address:
              type: string
              nullable: true
              description: Delivery address.
            type:
              $ref: '#/components/schemas/DeliveryTypes'
    DeliveryCase:
      properties:
        name:
          type: string
          description: Delivery name.
          example: zone A
        value:
          type: number
          description: Cost of delivery.
          example: 0.1
      description: Delivery information.
    CustomerShortInfo:
      type: object
      description: Customer information.
      allOf:
        - $ref: '#/components/schemas/ParticipantShortInfo'
        - properties:
            uid:
              type: string
              description: Customer UID in the UDS.
            membershipTier:
              $ref: '#/components/schemas/MembershipTier'
    GoodsOrderState:
      type: string
      description: |
        Order lifecycle status:
        * `NEW` — order just created, awaiting processing
        * `COMPLETED` — order fulfilled and transaction created
        * `DELETED` — order canceled
        * `WAITING_PAYMENT` — awaiting online payment confirmation
        * `NEED_ACK` — order requires merchant acknowledgment
      enum:
        - NEW
        - COMPLETED
        - DELETED
        - WAITING_PAYMENT
        - NEED_ACK
    GoodsOrderUpdateStatus:
      type: string
      description: |
        Order processing status set by the merchant:
        * `ACCEPTED` — merchant has accepted the order and is preparing it
        * `READY` — order is ready for pickup or delivery
      enum:
        - ACCEPTED
        - READY
    GoodsMeasurement:
      type: string
      description: Goods measurement.
      enum:
        - PIECE
        - CENTIMETRE
        - METRE
        - MILLILITRE
        - LITRE
        - GRAM
        - KILOGRAM
        - TON
        - SQUARE_METRE
        - CUBIC_METRE
        - DAY
        - HOUR
        - MINUTE
        - KILOMETRE
    VatCode:
      type: string
      description: VAT rate codes
      enum:
        - NO_NDS
        - NDS_0
        - NDS_10
        - NDS_20
        - NDS_10_110
        - NDS_20_120
    PaymentSubject:
      type: string
      description: |
        Payment item attribute:
        * COMMODITY - Commodity
        * EXCISE - Excise
        * SERVICE - Service
      enum:
        - COMMODITY
        - EXCISE
        - SERVICE
    TaxSystemCode:
      type: string
      description: |
        Tax system codes
        * OSN - General taxation system
        * USN_INCOME - Simplified (USN, income)
        * USN_INCOME_EXPENSES - Simplified (USN, income minus expenses)
        * ENVD - A single tax on imputed income (ENVD)
        * ESN - Unified agricultural tax (ESN)
        * PSN - Patent tax system
      enum:
        - OSN
        - USN_INCOME
        - USN_INCOME_EXPENSES
        - ENVD
        - ESN
        - PSN
    TagId:
      type: integer
      format: int64
      example: 1
      description: Tag identifier
    TagModel:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/TagId'
        name:
          description: Tag name
          type: string
      description: Tag.
    ExternalInfoUpdateModel:
      type: object
      properties:
        link:
          type: string
          nullable: true
          description: external order link
          example: 'https://www.ozon.ru/my/orderdetails/?order=00099999-04011'
        orderId:
          type: string
          description: 'external order id, regex `^(\w|-|\+)+$`'
          minLength: 1
          maxLength: 256
