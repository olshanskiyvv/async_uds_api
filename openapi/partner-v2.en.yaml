openapi: 3.0.1
info:
  title: UDS API
  version: 2.0.0
  description: >
    This document describes the **Partner API v2** provided by UDS — a loyalty

    platform that connects businesses with customers through mobile and web
    applications.


    The Partner API is designed for developers who integrate UDS loyalty program
    into

    POS systems, e-commerce platforms, mobile apps, or any third-party
    application

    that processes customer transactions.



    ## What you can do with Partner API


    - **Settings** — retrieve your company's loyalty program configuration
    (discount policies, membership tiers, reward rates)


    - **Customers** — search, list, and retrieve customer profiles with point
    balances and membership tier information


    - **Operations** — create purchase transactions, calculate discounts and
    cashback, process refunds, award bonus points


    - **Goods** — manage product catalog (categories, items, variants,
    inventory, images)


    - **Goods Orders** — process online orders from UDS marketplace (accept,
    modify, complete, cancel)


    - **Webhooks** — receive real-time notifications about operations, new
    customers, and orders


    - **Tags** — manage customer segmentation tags



    ## Common API Use Case



    The following scenario describes a typical checkout integration with UDS.

    Review all available endpoints to implement more advanced scenarios such as

    online ordering, product catalog management, or customer segmentation.



    1. When partner's application is ready for checkout it may suggest a

    customer getting a discount and earn reward points. In order to achieve

    this, the customer should have a UDS application and be able to generate a

    promo code (QR code) and provide it to the application (e.g., type the code

    into a checkout form).


    2. The customer opens the mobile application and selects "Discount" action.

    A new promo code is shown to the customer.


    3. The customer provides this promo code to the application, so it may be

    used for further requests.



    **NB!** *The promo code is not an identifier of the customer. It has a short

    life-time period and may be used only once. The application should not

    persist the code.*



    4. The application executes a "[Get Customer](#!/partner/get_customer)"

    request to obtain customer info and current amount of available reward

    points.


    5. Then the application may request the customer, whether he/she would like

    to pay for goods using available reward points.


    6. The customer specifies (types into a form) amount of points to withdraw

    and submits a checkout form.


    7. The application executes a "[Post Purchase](#!/partner/post_purchase)"

    request to submit purchase details, withdraw reward points and track

    purchase data in UDS CRM.


    8. Then the client receives a discount and his/her referral tiers earn

    reward points according to marketing settings.



    ## How to use API



    API provide access to API-methods via URI paths. In order to use an API the

    application should be able to make a HTTPS request and to parse the

    response. The API is stateless by design, so the client should provide all

    data required for request processing in each request. Information required

    for request processing (business logic) is represented as a part of URI

    string and/or as content of the request body (for POST/PUT methods).

    Information required for data exchange infrastructure (e.g., authorization

    handling) is represented via custom request headers.



    The response format is JSON (please, check specification of each method

    regarding actual objects' structures). Your methods will be the standard

    HTTP methods: GET, POST or PUT. Partner API is based on open standards, so

    you can use any web development language to access the API.



    ### URI



    Each API method has a bound URI path. Therefore each request sent to the

    server will have destination according to the following format:

    `https://<base_uri>/<method_path>/<additional_qualifier>`



    Base URI to access the API is `https://'api.uds.app/partner/v2`.



    ### Request Headers



    There are several headers, which should be placed on each request in order

    to meet transportation infrastructure requirements.



    <table>


    <thead>


    <tr>


    <th>Name</th>


    <th>Format (Data Type)</th>


    <th>Description</th>


    </tr>


    </thead>


    <tbody><tr>


    <td><strong>Common Headers</strong></td>


    <td></td>


    <td></td>


    </tr>


    <tr>


    <td>Accept</td>


    <td>MIME Type</td>


    <td>should be <code>application/json</code></td>


    </tr>


    <tr>


    <td>Accept-Charset</td>


    <td>String</td>


    <td>should be <code>utf-8</code></td>


    </tr>


    <tr>


    <td>Content-Type</td>


    <td>MIME Type</td>


    <td>should be <code>application/json</code>;<br> applicable for POST

    method</td>


    </tr>


    <tr>


    <td><strong>Custom Headers</strong></td>


    <td></td>


    <td></td>


    </tr>


    <tr>


    <td>X-Origin-Request-Id</td>


    <td>UUID</td>


    <td>identifier of the request used by the application;<br> may be omitted,

    but it's recommended to use it</td>


    </tr>


    <tr>


    <td>X-Request-Id</td>


    <td>UUID</td>


    <td>identifier of the request used by the Partner API</td>


    </tr>


    <tr>


    <td>X-Timestamp</td>


    <td>ISO 8601 Date</td>


    <td>date and time when request was originated</td>


    </tr>


    </tbody>


    </table>



    ### Data Types



    Here are special notices regarding data types used by the Partner API.

    Please consider this notices as requirements, since not following them may

    result in lack of functionality, errors or unpredictable behavior.



    #### Numbers and Rounding



    All numbers given to API **must** be rounded to two decimal places with

    "round half up" method. All responses from the server do also follow this

    rule; so every field, which is calculated on the server side, will have not

    more than two decimal digits and the number will be rounded with "half up"

    method.



    #### UUID



    The Partner API uses UUID 4 (or similar) to distinguish each request sent by

    the application. Clients should set headers `X-Origin-Request-Id` in

    requests and log (if possible) `X-Request-Id` set by the server in order to

    simplify debugging and to get a proper support in case of errors. It should

    be guaranteed, that there will be no duplication in these identifiers at

    least during a reasonable time period. At least these identifier should not

    be reused for further requests.



    #### Timestamps and dates



    For any timestamp or date in Partner API, we use [ISO

    8601](https://en.wikipedia.org/wiki/ISO_8601) format.



    Where we use timestamps:


    * `X-Timestamp` header


    * `dateCreated` field for operation


    * other headers or fields having explicit declaration of `Date` or `ISO 8601

    Date` types.



    ### Making Requests



    Clients should set headers `X-Origin-Request-Id` with UUID value and

    `X-Timestamp` with ISO-8601 timestamp value to all requests.


    On response server generates and sets new UUID to `X-Request-Id` and

    timestamp to `X-Timestamp` headers. If request contains

    `X-Origin-Request-Id` header then server sets it to response.



    **Example:**



    ```


    X-Origin-request-Id: 8c828ee7-e7b2-4631-a3e4-b18987962556


    X-Timestamp: 2016-07-08T13:17:39,245+00:00


    ```




    ### Response Codes and Errors



    The Partner API uses standard HTTP status codes in order to specify, whether

    the request was successful or not. Some responses may also contain

    `errorCode` field which contains a detailed explanation of the error

    occurred. It is expected, that all requests resulted in 4xx (client-side

    error) response status will not be retried until the source of the error is

    not eliminated.



    #### Response Codes



    <table>


    <thead>


    <tr>


    <th>Response code</th>


    <th>Description</th>


    </tr>


    </thead>


    <tbody><tr>


    <td><code>200</code></td>


    <td>Okay. API call was successful</td>


    </tr>


    <tr>


    <td><code>400</code></td>


    <td>Validation error or business logic error has occurred</td>


    </tr>


    <tr>


    <td><code>403</code></td>


    <td>Access denied, given authentication token is not set or has insufficient

    permissions</td>


    </tr>


    <tr>


    <td><code>404</code></td>


    <td>Either requested entity or requested api-method or path does not

    exist</td>


    </tr>


    </tbody></table>



    #### Error object



    When API-method call results in an error then response will contain JSON

    error object.


    For most of all error responses this object has next schema:



    ```json


    {
      "errorCode": "<Short code for given error>",       // string
      "message": "<Human readable error description>"    // string
    }


    ```



    > **Tip:** Language for error description depends on `Accept-Language`

    HTTP-header.



    There is the special error code for form validation errors - `badRequest`.

    If error object has that error code then response also will contain `errors`

    property with next schema:



    ```json


    {
      "errorCode": "badRequest",                         // string
      "message": "<Error description>",                  // string
      "errors": [                                        // array
        {
          "errorCode": "nullable",                       // string
          "message": "Property [points] cannot be null", // string
          "field": "points",                             // string, optional
          "value": null                                  // string, optional
        },
        ...
      ]
    }


    ```



    #### Common Error Codes



    <table>


    <thead>


    <tr>


    <th>Error Code</th>


    <th>Description</th>


    </tr>


    </thead>


    <tbody><tr>


    <td><code>forbidden</code></td>


    <td>Access denied, given authentication token is not set or has insufficient

    permissions</td>


    </tr>


    <tr>


    <td><code>notFound</code></td>


    <td>An entity not found. Where entity refers to a customer or

    promo-code.</td>


    </tr>


    <tr>


    <td><code>badRequest</code></td>


    <td>Form validation errors have occurred. For example, it can be

    type-mismatch or constraint violation errors.</td>


    </tr>


    </tbody>


    </table>



    #### Method specific error codes



    Each API-method call can produce errors which are specific for this method.

    For details about those errors read in method description provided in each

    API path.
servers:
  - url: 'https://api.uds.app/partner/v2'
    description: API server
security:
  - Basic: []
tags:
  - name: Settings
    description: >-
      Retrieve your company's loyalty program configuration including discount
      policies, membership tiers, reward rates, and referral settings. Call this
      endpoint on application startup and cache the settings locally.
    x-displayName: Settings
  - name: Operations
    description: >-
      Create, retrieve, and manage customer purchase transactions. Handles point
      redemption, discount application, cashback calculation, refunds, and bonus
      rewards. This is the core transactional API for POS and e-commerce
      integration.
    x-displayName: Operations
  - name: Customers
    description: >-
      Search, list, and retrieve customer profiles within your company's loyalty
      program. Access customer point balances, membership tiers, transaction
      statistics, and manage customer segmentation tags.
    x-displayName: Customers
  - name: Webhooks
    x-displayName: Webhooks
    description: >-
      Receive real-time HTTP notifications when events occur in UDS — new
      operations, customer registrations, and goods orders. Configure webhook
      URLs in UDS Admin. All requests are signed with X-Signature header for
      verification.
  - name: Goods
    description: >-
      Manage your product catalog in UDS. Partner API methods allow you to set
      up automatic product loading into UDS and update product information
      (prices, descriptions, stock quantities, photos, etc.) from your
      accounting system. Create, update, and delete categories, items, and
      varying items (items with variants). Supports inventory tracking,
      promotional pricing, images, and measurements.
    x-displayName: Goods
  - name: Goods Order
    description: >-
      Process online orders placed through the UDS marketplace. Accept, modify,
      complete, or cancel orders. **Beta** — parameters may change. Use at your
      own risk.
    x-displayName: Goods Orders
  - name: Image uploading
    description: >-
      Generate presigned URLs for uploading product images.


      ### Key steps


      1. Send a request to get a presigned upload URL.


      2. From the response, upload the image to the `url` using the HTTP method
      from `method` and headers from `headers`.


      3. After uploading images, create or update the product by passing the
      list of image identifiers (`imageId`) in the `photos` parameter.


      * When uploading an image, set `Content-Type: image/jpeg` in the headers,
      along with any other headers returned in the presigned URL response.


      * Steps 1–2 can be repeated multiple times to upload multiple product
      images (maximum 5 photos per product).


      * If you pass an empty list `photos: []` in the `data` object when
      updating a product, all product images will be deleted.
    x-displayName: Image uploading
  - name: Tags
    description: >-
      Retrieve company-defined tags for customer segmentation. Segmentation is
      used to divide the customer base and identify individual user groups by
      criteria of interest for further analysis and targeted actions. Tags are
      created in UDS Admin and can be assigned to customers via the Customers
      API.
    x-displayName: Company tags
  - name: FAQ
    description: >
      ## Frequently Asked Questions


      ### Where can I get a customer code (QR code) for processing payments?


      * Install the UDS mobile app ([App
      Store](https://apps.apple.com/app/game-united-discount-system/id954809132),
      [Google
      Play](https://play.google.com/store/apps/details?id=com.setinbox.game),
      [App Gallery](https://appgallery.huawei.com/#/app/C101533881)) and
      register. To generate a code, tap the card in the app.


      ### What is the lifetime of a customer code from the app?


      * The code is valid for 45 minutes. It is invalidated early if a payment
      is made using it.


      ### How can I get a code with an extended lifetime?


      * Add the `exchangeCode=true` parameter to the [customer →
      find](https://docs.uds.app/#tag/Customers/paths/~1customers~1find/get)
      request. The response will include a long-lived code in the `code` field
      that can be used to redeem points for 24 hours.


      ### How can I get test access to the API?


      * Contact us at [support@uds.app](mailto:support@uds.app) to request a
      test license.


      ### Where can I find the API Key and company ID?


      * Copy the company ID and API Key from UDS Business settings on the
      [Integration](https://admin.uds.app/admin/integration) page.


      ### Can I use the same API Key and company ID on multiple cash registers?


      * Each company has only one set of integration credentials in UDS, so the
      same API Key and company ID are used on all cash registers. Identification
      by register/branch/employee is done by passing parameters in the `cashier`
      field.


      ### Can I change the bonus points percentage for customer purchases via
      the API?


      * No. Bonus point accrual depends on the `cash` parameter and the bonus
      settings for customer tiers in the company. To limit points accrual, pass
      the `skipLoyaltyTotal` parameter — the portion of the receipt amount on
      which bonus points should not be accrued.


      ### Can bonus points be redeemed by phone number or customer UID?


      * Points can be redeemed by phone number only if the corresponding setting
      is enabled in the company. Points cannot be redeemed by customer UID.


      ### Can bonus points be rounded up when creating an operation?


      * No. Bonus points can only be rounded down.


      ### What is the external cashier identifier?


      * To identify the employee who processed the payment via UDS, you need to
      send the employee's individual number — their identifier. This identifier
      can be set in UDS Business for each employee in the corresponding field —
      external identifier.


      ### How do I configure a webhook?


      * Webhooks are configured in UDS Business settings on the
      [Integration](https://admin.uds.app/admin/integration) page. Specify the
      URL of your server where the webhook will be sent.


      ### Why do I receive multiple webhooks with the same information?


      * A webhook is retried up to three times at 5-minute intervals if it was
      not delivered or a 200 response was not received within 5 seconds.



      ## API Error Codes Reference


      | Status | Error Code | Description |

      |--------|------------|-------------|

      | `400` | badRequest | Validation errors occurred. See the `errors` field
      for details. Occurs when an invalid request is sent. |

      | `400` | invalidChecksum | The values in `cash`, `points`, or `total` do
      not match the discount method setting in the [loyalty
      program](https://admin.uds.app/admin/marketing/discount) settings. For
      bonus points accrual: `total = cash + points`. For discount: `total =
      (cash + points) / (1 - discount rate)`. Common causes: third-party
      discounts applied, incorrect rounding. For vouchers: discount method is
      not `CHARGE_SCORES`, accrual rate is `0.0`, or `total` ≤
      `skipLoyaltyTotal`. |

      | `400` | withdrawNotPermitted | The `participant → uid` was specified but
      `points` is not `0.0`. Can also occur if `uid` or `phone` is sent together
      with `code` when redeeming points — remove `uid` and `phone` and use only
      `code`. Also occurs when trying to redeem points by UID or phone if the
      company does not allow it. Set `points` to `0.0`. |

      | `400` | insufficientFunds | The `points` value exceeds the customer's
      available bonus point balance. Usually caused by incorrect rounding —
      points can only be rounded down. |

      | `400` | discountLimitExceed | The `points / total` ratio exceeds the
      maximum allowed in UDS settings. Check the maximum redemption percentage
      in [Loyalty Program](https://admin.uds.app/admin/marketing/discount)
      settings. |

      | `400` | purchaseByPhoneDisabled | Purchase by phone number is not
      allowed by UDS settings. Enable the [purchase by
      phone](https://admin.uds.app/admin/marketing/discount) setting in UDS
      Business. |

      | `400` | participantIsBlocked | The customer is blocked in this company.
      |

      | `400` | goods.nodeIndex.invalid | Specifying a `nodeId` is not allowed
      when creating a category. Verify the correct category ID. |

      | `400` | goods.limitIsReached | The product limit has been exceeded.
      Check the limit in the [Goods &
      Services](https://admin.uds.app/admin/price-list) section of UDS Business.
      |

      | `401` | unauthorized | Invalid company ID or API Key. Verify your
      credentials on the [Integration](https://admin.uds.app/admin/integration)
      page and check your Basic authentication. |

      | `404` | notFound | Customer with the given payment code or identifier
      was not found. Usually occurs with an incorrectly entered code or an
      expired code. Also occurs when searching by phone number if the number is
      not registered and has no prior operations in the company. |



      ## Changelog


      ### 2025-09-22


      * Added `offerPrice` and `skipLoyalty` fields to the
      [order](https://docs.uds.app/#tag/Goods-Order) model and the [new order
      webhook](https://docs.uds.app/#tag/Webhooks/paths/~1api~1v2~1events~1goods-order/post).


      ### 2025-07-21


      * Added `usePointsByPhone` field to the [company
      settings](https://docs.uds.app/#tag/Settings) model.


      ### 2025-02-03


      * Added new methods for
      [getting](https://docs.uds.app/#tag/Goods/paths/~1goods~1external~1{externalId}/get),
      [updating](https://docs.uds.app/#tag/Goods/paths/~1goods~1external~1{externalId}/put),
      and
      [deleting](https://docs.uds.app/#tag/Goods/paths/~1goods~1external~1{externalId}/delete)
      goods by external identifier.


      ### 2024-08-26


      * Added `cashSpent`, `savedFunds`, `invitedCount`,
      `effectiveInvitedCount`, `operationsCount`, `fullRefundsCount`, `note`,
      `pointsExpireIn` fields to the
      [customer](https://docs.uds.app/#tag/Customers) model.


      ### 2024-06-24


      * Added `certificatePoints` field to the
      [operation](https://docs.uds.app/#tag/Operations) model.


      ### 2024-03-11


      * Added `nodeId` field to the [goods](https://docs.uds.app/#tag/Goods)
      model.


      ### 2024-02-19


      * Added new method for [canceling
      orders](https://docs.uds.app/#tag/Goods-Order/paths/~1goods-orders~1{id}~1cancel/post).

      * Added new method for [changing order
      status](https://docs.uds.app/#tag/Goods-Order/paths/~1goods-orders~1{id}~1change-status/post).

      * Added `orderStatus` field to the
      [order](https://docs.uds.app/#tag/Goods-Order) model.


      ### 2023-10-09


      * Added `vatCode` and `paymentSubject` fields to the
      [goods](https://docs.uds.app/#tag/Goods) model for VAT codes (`NO_NDS`,
      `NDS_0`, `NDS_10`, `NDS_20`, `NDS_10_110`, `NDS_20_120`) and payment
      subject types (`COMMODITY`, `EXCISE`, `SERVICE`).


      ### 2023-04-24


      * Added `unredeemableTotal` — the receipt amount for which point
      redemption is not allowed — to [find
      customer](https://docs.uds.app/#tag/Customers/paths/~1customers~1find/get),
      [calculate
      discount](https://docs.uds.app/#tag/Operations/paths/~1operations~1calc/post),
      and [create
      operation](https://docs.uds.app/#tag/Operations/paths/~1operations/post).

      * Added `maxScoresDiscount` and `certificatePoints` to the
      [PurchaseCalc](https://docs.uds.app/#tag/Operations/paths/~1operations~1calc/post)
      model.


      ### 2022-07-18


      * Added `maxScoresDiscount` to the
      [customer](https://docs.uds.app/#tag/Customers) model.


      ### 2022-04-25


      * Added new methods for [listing company
      tags](https://docs.uds.app/#tag/Tags/paths/~1tags/get), [getting customer
      tags](https://docs.uds.app/#tag/Customers/paths/~1customers~1{id}~1tags/get),
      and [setting customer
      tags](https://docs.uds.app/#tag/Customers/paths/~1customers~1{id}~1tags/post).

      * Added `tags` field to the
      [customer](https://docs.uds.app/#tag/Customers) model and [create
      operation](https://docs.uds.app/#tag/Operations/paths/~1operations/post).


      ### 2022-04-11


      * Added `measurement`, `minQuantity`, and `increment` fields to the
      [goods](https://docs.uds.app/#tag/Goods) model for different measurement
      units and minimum order quantities.


      ### 2022-03-28


      * Added `email` field to the
      [customer](https://docs.uds.app/#tag/Customers) model.


      ### 2021-11-29


      * Added `channelName` field to the
      [customer](https://docs.uds.app/#tag/Customers) model for tracking the
      acquisition channel.


      ### 2021-09-21


      * Added `photos` and `imageUrls` fields to the
      [goods](https://docs.uds.app/#tag/Goods) model for product images.

      * Added `image-upload-url` method for generating image upload URLs.


      ### 2021-08-23


      * Added `inventory` with `inStock` field to the
      [goods](https://docs.uds.app/#tag/Goods) model for stock tracking.

      * Added `cursor` parameter to replace `offset` for paginating the
      [operations
      list](https://docs.uds.app/#tag/Operations/paths/~1operations/get).


      ### 2021-07-12


      * Added [voucher
      creation](https://docs.uds.app/#tag/Operations/paths/~1operations~1voucher/post)
      method for accruing bonus points via printed QR code.

      * For performance optimization, [operations
      list](https://docs.uds.app/#tag/Operations/paths/~1operations/get) `total`
      now always returns `0`.


      ### 2021-02-08


      * Added `silent` field to [send bonus
      points](https://docs.uds.app/#tag/Operations/paths/~1operations~1reward/post).
      When `silent = true`, no push notification is sent to the customer.
    x-displayName: FAQ
paths:
  /settings:
    get:
      summary: Get company loyalty settings
      tags:
        - Settings
      description: >
        Retrieves your company's current loyalty program configuration,
        including discount policy,

        membership tier structure, referral reward rates, and operational
        limits.


        **When to use:** Call this endpoint when initializing your application
        or periodically

        (e.g., daily) to cache current settings. Settings rarely change but
        affect all transaction calculations.


        Marketing settings can be configured in [UDS
        Admin](https://admin.uds.app/admin/marketing/discount).
      x-codeSamples:
        - lang: curl
          source: |
            curl -H 'Accept: application/json' \
                 -H "X-Origin-Request-Id: $(uuidgen)" \
                 -H "X-Timestamp: $(date --iso-8601=seconds --utc)" \
                 -u "<companyId>:<api_key>"
                 -X GET -s https://api.uds.app/partner/v2/settings
        - lang: PHP
          source: >
            $date = new DateTime();

            $url = "https://api.uds.app/partner/v2/settings";

            $uuid_v4 = 'UUID'; //generate universally unique identifier version
            4 (RFC 4122)

            $companyId = 123; //set ID of your company

            $apiKey = 'ZDk1MmE5NzMtODcxNi00YzIwLTllZDMtN2ZjM2NjOGI2YTMz'; //set
            company apikey


            // Create a stream


            $opts = array(
                'http' => array(
                    'method' => 'GET',
                    'header' => "Accept: application/json\r\n" .
                                "Accept-Charset: utf-8\r\n" .
                                "Authorization: Basic ". base64_encode("$companyId:$apiKey")."\r\n" .
                                "X-Origin-Request-Id: ".$uuid_v4."\r\n" .
                                "X-Timestamp: ".$date->format(DateTime::ATOM)
                )
            );


            $context = stream_context_create($opts);

            $result = file_get_contents($url, false, $context);


            echo $result;
        - lang: Python
          source: |
            import json
            import uuid
            import base64
            from datetime import datetime
            from http.client import HTTPSConnection

            authString = base64.b64encode(b'<companyId>:<apiKey>')
            con = HTTPSConnection('api.uds.app')
            con.request(
                method='GET',
                url='/partner/v2/settings',
                headers={
                    'Accept': 'application/json',
                    'Accept-Charset': 'utf-8',
                    'Authorization': 'Basic ' + authString.decode("utf-8"),
                    'X-Origin-Request-Id': str(uuid.uuid4()),
                    'X-Timestamp': datetime.now().isoformat(),
                })
            print (con.getresponse().read())
            con.close()
        - lang: Node
          source: |
            const https = require('https');
            const uuid = require('uuid4');
            const authString = '<companyId>' + ':' + '<apiKey>';

            const options = {
              'host': 'api.uds.app',
              'port': 443,
              'path': '/partner/v2/settings',
              'method': 'GET',
