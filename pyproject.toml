[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "async-uds-api"
version = "0.1.0"
description = "Асинхронный Python-клиент для UDS Partner API v2 на базе httpx и pydantic."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Your Name", email = "you@example.com" },
]
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.0",
  "ruff>=0.15.0",
  "ty>=0.0.21",
]

[project.urls]
Homepage = "https://api.uds.app/partner/v2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.setuptools.packages.find]
where = ["."]
include = ["async_uds_api*"]

