[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "async-uds-api"
version = "0.1.2"
description = "Неофициальный асинхронный Python-клиент для UDS Partner API"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vladislav Olshanskiy", email = "rvv200345@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "uds",
    "uds-app",
    "api",
    "uds-partner-api",
    "uds-api-client",
    "async",
    "asyncio",
    "httpx",
    "pydantic",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27.0", "pydantic>=2.0.0", "aiofiles>=23.0.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.15.0",
    "ty>=0.0.21",
    "twine>=6.0.0",
]

[project.urls]
Homepage = "https://docs.uds.app"
Repository = "https://github.com/olshanskiyvv/async_uds_api"
Documentation = "https://github.com/olshanskiyvv/async_uds_api#readme"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.setuptools.packages.find]
where = ["."]
include = ["async_uds_api*"]
