[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "async-uds-api"
version = "0.1.0"
description = "Асинхронный Python-клиент для UDS Partner API v2 на базе httpx и pydantic."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Your Name", email = "you@example.com" },
]
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://api.uds.app/partner/v2"

[tool.setuptools.packages.find]
where = ["."]
include = ["async_uds_api*"]

